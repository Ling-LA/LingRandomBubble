name: Build experimental APK
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install fixed Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test production core policy
        run: bash tools/test-core.sh
      - name: Compile APK and Android Lint
        run: bash tools/gradle-bootstrap.sh --no-daemon --console=plain :app:assembleDebug :app:lintDebug
      - name: Prepare artifacts
        run: |
          mkdir -p out/apk
          cp app/build/outputs/apk/debug/app-debug.apk out/apk/LingRandomBubble-0.1.0-debug.apk
          cp README.md out/apk/README.md
          cd out/apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LingRandomBubble-0.1.0-experimental
          path: out/apk/
          if-no-files-found: error
          retention-days: 14
