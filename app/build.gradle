plugins { id 'com.android.application' }
android {
    namespace 'io.github.ling.randombubble'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.ling.randombubble'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '0.1.19-experimental'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            // No signing keys are included. Configure your own key for release builds.
        }
    }
    lint { abortOnError true }
}
dependencies { compileOnly 'de.robv.android.xposed:api:82' }
